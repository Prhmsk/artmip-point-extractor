[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artmip-point-extractor"
version = "0.1.0"
description = "Streamlit application for extracting location-based ARTMIP atmospheric-river activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.53,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "xarray>=2025.6,<2027",
  "scipy>=1.14,<2",
  "requests>=2.32,<3",
  "netcdf4>=1.7,<2",
  "xlsxwriter>=3.2,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
